<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient for Text/Highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    /* Animated Floating Pulse Elements */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes floatWave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulsing-circle {
      animation: pulse 4s infinite ease-in-out;
      transform-origin: center;
    }
    .wave-line {
      stroke-dasharray: 10 15;
      animation: floatWave 12s linear infinite;
    }
    .radar-sweep {
      transform-origin: 980px 180px;
      animation: radarScan 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND GRAPHICS (Behind Text) -->
  <g opacity="0.25">
    <!-- Animated Waves / Telemetry Signals -->
    <path class="wave-line" d="M -50 280 Q 200 180, 450 250 T 950 200 T 1250 270" fill="none" stroke="#3b82f6" stroke-width="3" />
    <path class="wave-line" d="M -50 310 Q 250 220, 550 290 T 1050 220 T 1250 300" fill="none" stroke="#8b5cf6" stroke-width="2" />

    <!-- Radar Circle Visual (Right Side Background) -->
    <circle cx="980" cy="180" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="980" cy="180" r="80" fill="none" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="980" cy="180" r="40" fill="none" stroke="#ec4899" stroke-width="1" />
    <line class="radar-sweep" x1="980" y1="180" x2="1100" y2="180" stroke="#38bdf8" stroke-width="2" />

    <!-- Pulsing Glow Orbs -->
    <circle class="pulsing-circle" cx="200" cy="80" r="90" fill="#3b82f6" filter="url(#glow)" />
    <circle class="pulsing-circle" cx="1020" cy="260" r="100" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Decorative Connected Nodes / Vehicle Telemetry Network Visual -->
  <g opacity="0.6">
    <line x1="820" y1="110" x2="900" y2="160" stroke="#475569" stroke-width="2" />
    <line x1="900" y1="160" x2="1010" y2="120" stroke="#475569" stroke-width="2" />
    <line x1="900" y1="160" x2="950" y2="240" stroke="#475569" stroke-width="2" />

    <circle cx="820" cy="110" r="6" fill="#38bdf8" />
    <circle cx="900" cy="160" r="8" fill="#8b5cf6" />
    <circle cx="1010" cy="120" r="6" fill="#ec4899" />
    <circle cx="950" cy="240" r="7" fill="#34d399" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Crisp & Unobscured) -->
  <!-- Category Tag Badge -->
  <g transform="translate(80, 65)">
    <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="22" class="tag">🚗 AUTOMOTIVE TELEMATICS &amp; FLEET</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="150" class="title">
    Awesome Fleet Data Collection
  </text>
  <text x="80" y="195" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="url(#accentGradient)">
    &amp; Vehicle Telemetry Pipeline Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="80" y="245" class="subtitle">
    Curated Platforms, OBD-II Diagnostics, CAN Bus Decoding &amp; Open-Source Telematics
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(80, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
    <text x="65" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">📡 CAN Bus / OBD-II</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="212" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">⚡ GPS &amp; MQTT Edge</text>

    <!-- Pill 3 -->
    <rect x="294" y="0" width="150" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
    <text x="369" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f472b6" text-anchor="middle">🔓 Open-Source &amp; SaaS</text>
  </g>
</svg>

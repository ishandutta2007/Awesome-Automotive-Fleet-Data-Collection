nt-weight="600" text-anchor="middle">⚡ GPS &amp; MQTT Edge</text><rect width="150" height="28" x="294" y="0" fill="#0f172a" stroke="#ec4899" stroke-width="1" rx="14"/><text x="369" y="18" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 Open-Source &amp; SaaS</text></g></svg>